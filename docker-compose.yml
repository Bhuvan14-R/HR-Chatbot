services:

  web:
    build: .

    ports:
      - "8081:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:5.7

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hr_chatbot

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: